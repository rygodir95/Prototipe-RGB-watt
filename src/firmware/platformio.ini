; ESP32 RGB Watt Zone Controller
; Standalone BLE Cycling Power -> RGB LED strip controller
;
; Two build environments:
;   esp32dev-dev  (DEFAULT) - development: USB flashing, verbose logs, unsigned OTA allowed.
;   esp32dev-prod           - production:  reduced logs, signed OTA enforced.
;
; NOTE: Neither environment enables irreversible hardware security (Secure Boot,
; Flash Encryption, anti-rollback eFuses). Those are provisioned by the explicit
; offline process in tools/production/ and are NOT a side-effect of any build.
[platformio]
default_envs = esp32dev-dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; min_spiffs provides two OTA app partitions (app0/app1) required for OTA updates.
board_build.partitions = min_spiffs.csv
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    adafruit/Adafruit NeoPixel @ ^1.12.3
    esp32async/AsyncTCP @ ^3.3.2
    esp32async/ESPAsyncWebServer @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:esp32dev-dev]
build_flags =
    ${env.build_flags}
    -DBUILD_DEV
    -DCORE_DEBUG_LEVEL=3

[env:esp32dev-prod]
build_flags =
    ${env.build_flags}
    -DBUILD_PROD
    -DCORE_DEBUG_LEVEL=0
