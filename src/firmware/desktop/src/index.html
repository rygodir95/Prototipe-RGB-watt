<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZoneGlow</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body data-state="connecting">
  <!-- Minimal desktop-level connection bar (shell only). The ZoneGlow UI
       itself is served by the backend and shown unchanged in the iframe. -->
  <header id="statusbar">
    <span id="statusDot"></span>
    <span id="statusText">Connecting…</span>
    <span class="sep">·</span>
    <span id="backendLabel">PC Simulator</span>
  </header>

  <!-- The existing ZoneGlow web UI (Dashboard / Devices / Zones / Settings),
       loaded unchanged from the backend. The backend serves the same files
       the ESP32 serves, so no UI code is duplicated or modified here. -->
  <iframe id="uiFrame" title="ZoneGlow" style="display:none"></iframe>

  <!-- Shell-level connection view, shown while the backend is unreachable.
       The Developer/Test Panel is intentionally NOT exposed here. -->
  <div id="overlay" style="display:flex">
    <div class="overlay-card">
      <div class="overlay-brand">
        <span class="overlay-dot"></span>
        <div>
          <h1>ZoneGlow</h1>
          <p>Training Zone Lighting</p>
        </div>
      </div>
      <p id="overlayHint" class="overlay-hint">Looking for the ZoneGlow backend…</p>
      <label class="overlay-label" for="backendUrl">Backend address</label>
      <div class="overlay-row">
        <input id="backendUrl" type="text" spellcheck="false" placeholder="http://localhost:8080" />
        <button id="connectBtn" type="button">Connect</button>
      </div>
    </div>
  </div>

  <script src="transport.js"></script>
  <script src="shell.js"></script>
</body>
</html>
