<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>ZoneGlow</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body data-state="connecting">
  <!-- Startup splash: branding while the first Hub probe runs. It never
       delays startup - it disappears as soon as the Hub responds, or after
       1.2 s at the latest, handing over to the normal connection view. -->
  <div id="splash" aria-hidden="true">
    <div class="splash-brand">
      <span class="overlay-dot"></span>
      <h1>ZoneGlow</h1>
      <p>Training Zone Lighting</p>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>

  <!-- Minimal connection bar (shell only). The ZoneGlow UI itself is
       served by the Hub and shown unchanged in the iframe below. -->
  <header id="statusbar">
    <span id="statusDot"></span>
    <span id="statusText">Connecting…</span>
    <span class="sep">·</span>
    <span id="hubLabel">ZoneGlow Hub</span>
    <button id="bleShellDisconnect" class="ble-shell-disconnect" type="button" hidden>Disconnect</button>
  </header>

  <!-- The existing ZoneGlow web UI (Dashboard / Devices / Zones / Settings),
       loaded unchanged from the Hub. The Hub serves the same files the ESP32
       serves, so no UI code is duplicated or modified here. -->
  <iframe id="uiFrame" title="ZoneGlow" style="display:none"></iframe>

  <!-- Shell-level connection view, shown while the Hub is unreachable. -->
  <div id="overlay" style="display:flex">
    <div class="overlay-card">
      <div class="overlay-brand">
        <span class="overlay-dot"></span>
        <div>
          <h1>ZoneGlow</h1>
          <p>Training Zone Lighting</p>
        </div>
      </div>
      <p id="overlayHint" class="overlay-hint">Searching for Hub…</p>
      <label class="overlay-label" for="hubUrl">Hub address</label>
      <div class="overlay-row">
        <input id="hubUrl" type="text" spellcheck="false" inputmode="url"
               placeholder="http://zoneglow.local" />
        <button id="connectBtn" type="button">Connect</button>
      </div>
      <p class="overlay-tip">Suggestion: <code>http://zoneglow.local</code> or the Hub's IP, e.g. <code>192.168.1.50</code></p>
      <button id="bleBtn" class="secondary-btn" type="button">Use Bluetooth instead</button>
    </div>
  </div>

  <div id="blePanel" class="ble-panel" hidden>
    <div class="overlay-card">
      <div class="overlay-brand"><span class="overlay-dot"></span><div><h1>Bluetooth Hub</h1><p>Local control connection</p></div></div>
      <p id="bleHint" class="overlay-hint">Search for a nearby Training Hub.</p>
      <div id="bleDevices" class="ble-devices"></div>
      <div id="bleLive" class="ble-live" hidden></div>
      <div id="bleConfig" class="ble-live" hidden></div>
      <div id="bleSetup" class="ble-devices" hidden>
        <label>FTP (W) <input id="bleFtp" type="number" min="0" max="1000"></label>
        <label>Max HR <input id="bleHrMax" type="number" min="0" max="230"></label>
        <label>Brightness <input id="bleBrightness" type="number" min="0" max="100"></label>
        <button id="bleSaveSetup" type="button">Save setup</button>
      </div>
      <div id="bleZones" class="ble-devices" hidden></div>
      <div id="bleSensors" class="ble-devices"></div>
      <div class="ble-actions">
        <button id="bleScanBtn" type="button">Search</button>
        <button id="bleSensorScanBtn" class="secondary-btn" type="button" disabled>Find sensors</button>
        <button id="bleLightingBtn" class="secondary-btn" type="button" disabled>Lighting Test</button>
        <button id="bleDisconnectBtn" class="secondary-btn" type="button" disabled>Disconnect</button>
      </div>
    </div>
  </div>

  <script src="transport.js"></script>
  <script src="ble-transport.js"></script>
  <script src="ble-web-host.js"></script>
  <script src="shell.js"></script>
</body>
</html>
