<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>ZoneGlow</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body data-state="connecting">
  <!-- Minimal connection bar (shell only). The ZoneGlow UI itself is
       served by the Hub and shown unchanged in the iframe below. -->
  <header id="statusbar">
    <span id="statusDot"></span>
    <span id="statusText">Connecting…</span>
    <span class="sep">·</span>
    <span id="hubLabel">ZoneGlow Hub</span>
  </header>

  <!-- The existing ZoneGlow web UI (Dashboard / Devices / Zones / Settings),
       loaded unchanged from the Hub. The Hub serves the same files the ESP32
       serves, so no UI code is duplicated or modified here. -->
  <iframe id="uiFrame" title="ZoneGlow" style="display:none"></iframe>

  <!-- Shell-level connection view, shown while the Hub is unreachable. -->
  <div id="overlay" style="display:flex">
    <div class="overlay-card">
      <div class="overlay-brand">
        <span class="overlay-dot"></span>
        <div>
          <h1>ZoneGlow</h1>
          <p>Training Zone Lighting</p>
        </div>
      </div>
      <p id="overlayHint" class="overlay-hint">Looking for the ZoneGlow Hub…</p>
      <label class="overlay-label" for="hubUrl">Hub address</label>
      <div class="overlay-row">
        <input id="hubUrl" type="text" spellcheck="false" inputmode="url"
               placeholder="http://zoneglow.local" />
        <button id="connectBtn" type="button">Connect</button>
      </div>
      <p class="overlay-tip">Suggestion: <code>http://zoneglow.local</code> or the Hub's IP, e.g. <code>192.168.1.50</code></p>
    </div>
  </div>

  <script src="transport.js"></script>
  <script src="shell.js"></script>
</body>
</html>
