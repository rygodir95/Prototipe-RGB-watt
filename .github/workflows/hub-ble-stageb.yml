name: Hub BLE Stage B Verification (temporary)

on:
  push:
    branches: [feature/mobile-app]
    paths:
      - "src/firmware/**"
      - "mobile/tests/**"
      - ".github/workflows/hub-ble-stageb.yml"
  workflow_dispatch:

jobs:
  tests:
    name: Firmware and desktop tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hub BLE transfer tests (host state machine + source invariants)
        working-directory: src/firmware
        run: python tools/test_hub_ble.py
      - name: Client paged-transfer retry tests
        working-directory: src/firmware
        run: node tools/test_ble_transfer_retry.cjs
      - name: BLE liveness tests (heartbeat, initial status, banner/About)
        working-directory: src/firmware
        run: node tools/tests/ble_liveness/test_liveness.cjs
      - name: Desktop STATUS fallback tests (read fallback + startup ordering)
        working-directory: src/firmware
        run: node tools/tests/ble_liveness/test_status_fallback.cjs
      - name: All mobile regression suites
        shell: bash
        run: |
          failed=0
          for suite in mobile/tests/test-*.cjs; do
            echo "REGRESSION_SUITE=$suite"
            if node "$suite"; then echo "REGRESSION_PASS=$suite"; else echo "REGRESSION_FAIL=$suite"; failed=1; fi
          done
          exit "$failed"
      - name: PC simulator regression tests (Power + Heart Rate)
        if: always()
        working-directory: src/firmware/tools/pc-simulator
        run: python -m unittest discover -s tests -v
      - name: Compare mobile regressions against requested starting commit
        if: always()
        shell: bash
        run: |
          git fetch origin 9c2fe2d5159abbe3634c04c4a050f8c52a2c5925 --depth=1
          git worktree add --detach "$RUNNER_TEMP/ble-baseline" 9c2fe2d5159abbe3634c04c4a050f8c52a2c5925
          cd "$RUNNER_TEMP/ble-baseline"
          for suite in mobile/tests/test-*.cjs; do
            echo "BASELINE_SUITE=$suite"
            if node "$suite"; then echo "BASELINE_PASS=$suite"; else echo "BASELINE_FAIL=$suite"; fi
          done