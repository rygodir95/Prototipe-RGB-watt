name: LED pin validation

on:
  push:
    branches: [fix/led-pin-validation]
    paths: ["src/firmware/**", ".github/workflows/led-pin-validation.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        working-directory: src/firmware
        run: pio run
      - name: LED pin regression tests
        working-directory: src/firmware
        run: python tools/test_led_pin.py
      - name: Embedded web asset regression tests
        working-directory: src/firmware
        run: python tools/test_web_assets.py
      - name: Lighting concurrency and strip shrink regression tests
        working-directory: src/firmware
        run: python tools/test_lighting.py
      - name: Simulator regression tests
        working-directory: src/firmware/tools/pc-simulator
        run: python -m unittest discover -s tests -v
      - name: Prepare Windows flash package
        working-directory: src/firmware
        run: |
          pio run -t idedata
          python tools/package_windows_flash.py --output .pio/build/esp32dev-dev/windows-flash
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ZoneGlow-Firmware-esp32dev-dev-${{ github.sha }}
          path: src/firmware/.pio/build/esp32dev-dev/windows-flash/
          if-no-files-found: error

  windows-smoke:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ZoneGlow-Firmware-esp32dev-dev-${{ github.sha }}
          path: flash package
      - name: Test Windows updater without hardware
        shell: powershell
        run: ./src/firmware/tools/test_windows_flash.ps1 -Package './flash package'
