name: LED pin validation

on:
  push:
    branches: [fix/led-pin-validation]
    paths: ["src/firmware/**", ".github/workflows/led-pin-validation.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        working-directory: src/firmware
        run: pio run
      - name: LED pin regression tests
        working-directory: src/firmware
        run: python tools/test_led_pin.py
      - name: Simulator regression tests
        working-directory: src/firmware/tools/pc-simulator
        run: python -m unittest discover -s tests -v
