name: ZoneGlow Windows Debug Build

on:
  push:
    branches: [feature/mobile-app]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/firmware/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Tauri ACL capability check
        run: node ../tools/tests/tauri_acl/test_event_capability.cjs

      - name: Rust policy and actual session lifecycle tests
        run: |
          npm run prebuild:exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BLE_LIFECYCLE_TRACE = "$env:RUNNER_TEMP/ble-lifecycle-trace.json"
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../tools/tests/ble_liveness/test_session_lifecycle.cjs $env:BLE_LIFECYCLE_TRACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build ZoneGlow.exe (release, no bundling)
        run: npm run build:exe

      - name: Record exact commit and executable checksum
        run: |
          $sha = (Get-FileHash src-tauri/target/release/ZoneGlow.exe -Algorithm SHA256).Hash.ToLower()
          $commit = git rev-parse HEAD
          Write-Output "ZONEGLOW_BUILD_COMMIT=$commit"
          Write-Output "ZONEGLOW_EXE_SHA256=$sha"
          "$sha  ZoneGlow.exe" | Set-Content -Encoding ascii src-tauri/target/release/SHA256SUMS.txt
          $commit | Set-Content -Encoding ascii src-tauri/target/release/COMMIT.txt

      - name: Upload ZoneGlow.exe
        uses: actions/upload-artifact@v4
        with:
          name: ZoneGlow-Windows-Exe
          path: |
            src/firmware/desktop/src-tauri/target/release/ZoneGlow.exe
            src/firmware/desktop/src-tauri/target/release/SHA256SUMS.txt
            src/firmware/desktop/src-tauri/target/release/COMMIT.txt
          if-no-files-found: error