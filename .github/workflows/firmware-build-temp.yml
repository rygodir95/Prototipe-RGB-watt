# TEMPORARY firmware build-verification workflow for the ZoneGlow synchronization patch.
# Compiles both PlatformIO environments and, for esp32dev-dev, publishes a COMPLETE
# flash package: bootloader + partition table + OTA boot flag + application, plus a
# merged factory.bin and FLASHING.txt carrying the exact addresses.
# No hardware tests, no deployment, no releases. Delete once verified on hardware.
name: Firmware Build (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mobile-app

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        env:
          - esp32dev-dev
          - esp32dev-prod
    defaults:
      run:
        working-directory: src/firmware
    steps:
      - name: Check out intended repository and branch
        uses: actions/checkout@v4
        with:
          repository: rygodir95/Prototipe-RGB-watt
          ref: feature/mobile-app
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # platformio.ini leaves the platform unpinned ("platform = espressif32"), so a
      # fresh runner resolves the newest release. espressif32 8.x (Arduino core 3.x)
      # dropped the mbedtls_sha256_*_ret API used by src/WebInterface.cpp, so the build
      # only reproduces on the 7.1.3 toolchain. Pin it here instead of editing the
      # firmware's platformio.ini.
      - name: Pin ESP32 platform to the known-good toolchain
        run: |
          python - <<'PY'
          import pathlib

          src = pathlib.Path("platformio.ini")
          text = src.read_text()
          # platformio.ini now pins the toolchain itself; only pin an unpinned file
          # so this CI copy stays idempotent instead of producing "@7.1.3@7.1.3".
          pinned = text if "espressif32@" in text else text.replace(
              "platform = espressif32", "platform = espressif32@7.1.3"
          )
          pathlib.Path("platformio.ci.ini").write_text(pinned)
          print([l for l in pinned.splitlines() if "platform =" in l])
          PY

      - name: Build ${{ matrix.env }}
        id: build
        run: pio run -e ${{ matrix.env }} -c platformio.ci.ini

      - name: Upload firmware.bin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: src/firmware/.pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------------ dev flash package
      # Same idea as .github/workflows/firmware-build.yml, but driven by the pinned
      # config so offsets and images match the 7.1.3 build that actually ships.
      - name: Dump PlatformIO flash metadata (offsets + images)
        if: success() && matrix.env == 'esp32dev-dev'
        run: pio run -e esp32dev-dev -c platformio.ci.ini -t idedata

      - name: Assemble complete dev flash package
        if: success() && matrix.env == 'esp32dev-dev'
        run: |
          python - <<'PY'
          import glob, json, os, shutil, subprocess, sys

          ENV = "esp32dev-dev"
          BUILD = os.path.join(".pio", "build", ENV)
          with open(os.path.join(BUILD, "idedata.json")) as fp:
              extra = json.load(fp).get("extra", {})
          app_offset = extra.get("application_offset")
          images = extra.get("flash_images") or []
          if not app_offset or not images:
              sys.exit("idedata.json is missing application_offset/flash_images")

          stage = os.path.join(BUILD, "flash-package")
          if os.path.isdir(stage):
              shutil.rmtree(stage)
          os.makedirs(stage)
          for img in images:
              shutil.copy2(img["path"], os.path.join(stage, os.path.basename(img["path"])))

          missing = [n for n in ("bootloader.bin", "partitions.bin", "boot_app0.bin")
                     if not os.path.isfile(os.path.join(stage, n))]
          if missing:
              sys.exit("PlatformIO flash_images did not provide " + ", ".join(missing)
                       + " (staged: " + ", ".join(sorted(os.listdir(stage))) + ")")

          fw_bin = os.path.join(BUILD, "firmware.bin")
          if not os.path.isfile(fw_bin):
              sys.exit("Missing flashable application image: " + fw_bin)
          with open(fw_bin, "rb") as fp:
              magic = fp.read(4)
          if len(magic) < 4 or magic[0] != 0xE9:
              sys.exit("firmware.bin is not a flashable ESP32 image (first bytes " + magic.hex() + ")")
          shutil.copy2(fw_bin, os.path.join(stage, "firmware.bin"))

          # ---- partition table as actually generated in this build ----
          raw = open(os.path.join(stage, "partitions.bin"), "rb").read()
          plist = []
          for i in range(0, len(raw), 32):
              e = raw[i:i + 32]
              if len(e) < 32 or e[0] != 0xAA or e[1] != 0x50:
                  break
              plist.append((e[12:28].split(b"\x00")[0].decode("ascii", "replace"),
                            e[2], e[3],
                            int.from_bytes(e[4:8], "little"),
                            int.from_bytes(e[8:12], "little")))
          if not plist:
              sys.exit("partitions.bin is not a valid ESP32 partition table")
          app_off = int(app_offset, 16)
          app_parts = [p for p in plist if p[1] == 0 and p[3] == app_off]
          if not app_parts:
              sys.exit("idedata application_offset " + app_offset
                       + " matches no app partition in partitions.bin: " + str(plist))
          app_size = app_parts[0][4]
          app_bytes = os.path.getsize(fw_bin)
          if app_bytes > app_size:
              sys.exit("firmware.bin (" + str(app_bytes) + ") exceeds its app partition (" + str(app_size) + ")")

          # ---- esptool from the PlatformIO toolchain ----
          pkg_root = os.path.expanduser("~/.platformio/packages")
          hits = sorted(glob.glob(os.path.join(pkg_root, "tool-esptoolpy*", "esptool.py")))
          if not hits:
              hits = sorted(glob.glob(os.path.join(pkg_root, "tool-esptoolpy*", "**", "esptool.py"),
                                      recursive=True))
          if not hits:
              sys.exit("esptool.py not found under " + pkg_root)
          esptool = hits[0]

          parts = sorted(images, key=lambda i: int(i["offset"], 16))
          parts.append({"offset": app_offset, "path": "firmware.bin"})
          merge_args = []
          for img in parts:
              merge_args += [img["offset"], os.path.basename(img["path"])]

          merged = None
          for cmd in ("merge-bin", "merge_bin"):
              r = subprocess.run([sys.executable, esptool, "--chip", "esp32", cmd,
                                  "--output", "factory.bin"] + merge_args,
                                 cwd=stage, capture_output=True, text=True)
              print(cmd + " exit " + str(r.returncode))
              if r.returncode == 0:
                  merged = cmd
                  break
              print(((r.stdout or "") + (r.stderr or ""))[-2000:])
          if merged is None:
              sys.exit("factory.bin merge failed")

          factory = os.path.join(stage, "factory.bin")
          with open(factory, "rb") as ff:
              ff.seek(app_off)
              if ff.read(app_bytes) != open(fw_bin, "rb").read():
                  sys.exit("factory.bin does not carry firmware.bin at " + app_offset)
          fsize = os.path.getsize(factory)
          if fsize > 4 * 1024 * 1024:
              sys.exit("factory.bin exceeds the 4 MB target flash")

          by_name = {os.path.basename(i["path"]): i["offset"] for i in images}
          order = [("bootloader.bin", by_name["bootloader.bin"]),
                   ("partitions.bin", by_name["partitions.bin"]),
                   ("boot_app0.bin", by_name["boot_app0.bin"]),
                   ("firmware.bin", app_offset)]
          sep_cmd = " ".join(o + " " + n for n, o in order)

          L = []
          L.append("ZoneGlow Hub firmware - COMPLETE dev flash package")
          L.append("=" * 62)
          L.append("")
          L.append("PlatformIO env : esp32dev-dev")
          L.append("Chip           : ESP32-D0WD-V3 (rev 3.1), classic ESP32, 4 MB flash")
          L.append("Build id       : " + os.environ.get("GITHUB_SHA", "unknown"))
          L.append("")
          L.append("FILES IN THIS PACKAGE, WITH FLASH ADDRESSES")
          for name, off in order:
              L.append("  {0:<16} {1:<10} {2:>10} bytes".format(
                  name, off, os.path.getsize(os.path.join(stage, name))))
          L.append("  {0:<16} {1:<10} {2:>10} bytes".format(
              "factory.bin", "0x0", fsize))
          L.append("  FLASHING.txt     this file")
          L.append("")
          L.append("PARTITION TABLE (read from the partitions.bin in this package)")
          for label, ptype, subtype, off, size in plist:
              L.append("  {0:<10} {1:<5} offset 0x{2:06x}  size 0x{3:06x} ({4} bytes)".format(
                  label, "app" if ptype == 0 else "data", off, size, size))
          L.append("")
          L.append("Full chip = 4 MB, so every image above fits: app image ends at 0x{0:x}.".format(app_off + app_bytes))
          L.append("")
          L.append("RECOMMENDED - clean full flash of a new, blank or wiped board")
          L.append("  esptool.py --chip esp32 --port COM3 erase_flash")
          L.append("  esptool.py --chip esp32 --port COM3 --baud 921600 write_flash -z 0x0 factory.bin")
          L.append("")
          L.append("SAME RESULT, individual images (all four in one command)")
          L.append("  esptool.py --chip esp32 --port COM3 --baud 921600 write_flash -z " + sep_cmd)
          L.append("")
          L.append("APPLICATION-ONLY UPDATE (keeps bootloader, partition table and NVS settings)")
          L.append("  esptool.py --chip esp32 --port COM3 --baud 921600 write_flash -z "
                   + app_offset + " firmware.bin")
          L.append("")
          L.append("NOTES")
          L.append("  - firmware.bin alone is NOT enough on a blank chip: without the")
          L.append("    bootloader, the partition table and boot_app0.bin the chip does not boot.")
          L.append("  - erase_flash wipes NVS, i.e. saved WiFi credentials and settings.")
          L.append("  - If 921600 fails to connect, drop to --baud 115200.")
          L.append("  - esptool.py is bundled with PlatformIO; otherwise use: python -m esptool")
          L.append("  - Replace COM3 with the board's port (/dev/ttyUSB0 on Linux,")
          L.append("    /dev/cu.usbserial* on macOS).")
          L.append("  - After a full flash the board boots app0; OTA slots stay available.")
          L.append("")

          with open(os.path.join(stage, "FLASHING.txt"), "w") as fp:
              fp.write("\n".join(L))

          print("\n".join(L))
          print("Staged: " + ", ".join(sorted(os.listdir(stage))))
          PY

      - name: Upload dev flash package
        if: success() && matrix.env == 'esp32dev-dev'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32dev-dev-flash-package
          path: src/firmware/.pio/build/esp32dev-dev/flash-package/
          if-no-files-found: error
          retention-days: 30

      - name: Report result for ${{ matrix.env }}
        if: always()
        run: |
          {
            echo "### Firmware environment: ${{ matrix.env }}"
            echo ""
            echo "- Result: ${{ steps.build.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
